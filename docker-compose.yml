version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: social_pulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social_pulse_net

  redis:
    image: redis:7-alpine
    container_name: social_pulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social_pulse_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social_pulse_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/social_pulse
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=social-pulse-secret-key-change-in-production-min32chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - social_pulse_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social_pulse_worker
    restart: unless-stopped
    command: python -m app.workers.pipeline_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/social_pulse
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=false
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    networks:
      - social_pulse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social_pulse_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - social_pulse_net

volumes:
  postgres_data:
  redis_data:

networks:
  social_pulse_net:
    driver: bridge
